name: Smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Optional repository secrets. Without them the Supabase-backed tests are skipped and the
      # rest (pages, headers, CSP, third-party requests, form validation, booking dialog) still run.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and starts the app itself (npm run build && npm run start).
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
